spring.application.name=sentinel-cctv-monitor
server.port=8000
spring.datasource.url=jdbc:sqlite:./data/sentinel.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000
spring.sql.init.mode=always
spring.web.resources.static-locations=file:./static/
